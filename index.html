<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>✊ Rock Paper Scissors ✋</h1>

    <div class="score-board">
        <div class="score">
            <h2>You</h2>
            <p>0</p>
        </div>

        <div class="vs">VS</div>

        <div class="score">
            <h2>Computer</h2>
            <p>0</p>
        </div>
    </div>

    <div class="choices">

        <button class="choice rock">
            ✊
            <span>Rock</span>
        </button>

        <button class="choice paper">
            ✋
            <span>Paper</span>
        </button>

        <button class="choice scissors">
            ✌️
            <span>Scissors</span>
        </button>

    </div>
    <div class="result">
    Choose your move!
</div>

<button id="reset">Reset Score</button>

    <div class="result">
        Choose your move!
    </div>

</div>
        <script src="script.js"></script>
</body>
</html>
